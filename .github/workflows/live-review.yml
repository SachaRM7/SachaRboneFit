name: Live review
on:
  push:
    branches: [codex/live-action]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-not-a-secret
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: always()
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        if: always()
        run: npm test -- --maxWorkers=2 --testTimeout=15000
      - name: Components
        if: always()
        run: npm run test:composants -- --maxWorkers=2
      - name: Build
        if: always()
        run: npm run build
      - name: Disposable database schema
        if: always()
        run: npx drizzle-kit push --force
      - name: Live integration
        if: always()
        run: >-
          npm run test:integration --
          src/tests/reference-tronquee.itest.ts
          src/tests/serie-persistee.itest.ts
          src/tests/demarrage-puis-reprise.itest.ts
          src/tests/lignee-apres-perte-du-store.itest.ts
          src/tests/fin-de-seance-sans-fantome.itest.ts
          src/tests/debrief-persiste.itest.ts
          src/tests/douleur-vers-contrainte.itest.ts
          src/tests/symptome-general.itest.ts
          src/tests/isolation-comptes.itest.ts
